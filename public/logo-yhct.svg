<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer green ring -->
  <circle cx="100" cy="100" r="98" fill="#1a6b3c" />
  <circle cx="100" cy="100" r="90" fill="#fff" />
  <circle cx="100" cy="100" r="86" fill="#1a6b3c" />
  <circle cx="100" cy="100" r="72" fill="#fff" />

  <!-- Inner emblem background -->
  <circle cx="100" cy="100" r="68" fill="#8b0000" />

  <!-- Yin-Yang symbol -->
  <!-- Main white/black yin-yang -->
  <g transform="translate(100,100)">
    <!-- White half -->
    <path d="M0,-44 A44,44 0 0,1 0,44 A22,22 0 0,1 0,0 A22,22 0 0,0 0,-44Z" fill="#fff"/>
    <!-- Black half -->
    <path d="M0,-44 A44,44 0 0,0 0,44 A22,22 0 0,0 0,0 A22,22 0 0,1 0,-44Z" fill="#1a1a1a"/>
    <!-- Small circles -->
    <circle cx="0" cy="-22" r="8" fill="#1a1a1a"/>
    <circle cx="0" cy="22" r="8" fill="#fff"/>
    <!-- Outer ring of yin-yang -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="#c8a800" stroke-width="2"/>
  </g>

  <!-- Decorative gold ring around yin-yang -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#c8a800" stroke-width="1.5"/>

  <!-- Top text curved: ĐẠI HỌC Y DƯỢC TP. HỒ CHÍ MINH -->
  <defs>
    <path id="topArc" d="M 20,100 A 80,80 0 0,1 180,100"/>
    <path id="bottomArc" d="M 22,108 A 80,80 0 0,0 178,108"/>
  </defs>
  <text font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#fff" letter-spacing="0.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">ĐẠI HỌC Y DƯỢC TP. HỒ CHÍ MINH</textPath>
  </text>
  <text font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#fff" letter-spacing="0.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">KHOA Y HỌC CỔ TRUYỀN</textPath>
  </text>

  <!-- Small stars/dots between text -->
  <circle cx="100" cy="16" r="2.5" fill="#c8a800"/>
  <circle cx="100" cy="184" r="2.5" fill="#c8a800"/>
  <circle cx="15" cy="95" r="1.8" fill="#c8a800"/>
  <circle cx="185" cy="95" r="1.8" fill="#c8a800"/>
</svg>
